[project]
name = "lathe"
version = "0.1.0"
description = "Lathe coding agent"
readme = "README.md"
authors = [
    { name = "Sergey Poltavtsev" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
lathe = "lathe:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
    "ty>=0.0.110",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["generated_client"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade (PEP 585/604)
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length — the formatter owns this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
